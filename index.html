<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Остров добра</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background-color: white;
            border-radius: 20px;
            padding: 30px 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            box-sizing: border-box;
        }
        h1 { font-size: 26px; margin-top: 0; color: #1a1a1a; }
        p { color: #666; font-size: 16px; margin-bottom: 25px; }
        .card {
            background-color: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: left;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 15px;
            font-weight: 500;
        }
        .stat-row span:last-child { color: #2481cc; font-weight: bold; }
        .btn {
            background-color: #2481cc;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            margin-bottom: 12px;
            cursor: pointer;
            transition: opacity 0.2s;
            box-sizing: border-box;
        }
        .btn:active { opacity: 0.8; }
        .btn-secondary { background-color: #e9ecef; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="greeting">Привет, друг!</h1>
        <p>Это твой личный дашборд ментального здоровья.</p>

        <div class="card">
            <div class="stat-row">
                <span>Настроение сегодня:</span>
                <span id="mood-status">Не записано</span>
            </div>
            <div class="stat-row">
                <span>Серия привычек:</span>
                <span>0 дней 🔥</span>
            </div>
        </div>

        <button class="btn" onclick="startBreathing()">😰 Мне плохо (Дыхание)</button>
        <button class="btn btn-secondary" onclick="closeApp()">Закрыть приложение</button>
    </div>

    <script>
        // Проверяем, загрузился ли скрипт Telegram
        const tg = window.Telegram ? window.Telegram.WebApp : null;

        if (tg) {
            tg.expand(); // Раскрываем на весь экран
            
            // Пытаемся получить имя
            const user = tg.initDataUnsafe?.user;
            if (user && user.first_name && user.first_name.trim() !== "") {
                document.getElementById('greeting').innerText = `Привет, ${user.first_name}!`;
            }
        } else {
            document.getElementById('greeting').innerText = "Ошибка: Telegram не загрузился";
        }

        function startBreathing() {
            if (tg) {
                // 1. Показываем окошко для проверки, что клик сработал
                tg.showAlert("Кнопка нажата! Отправляю данные боту...");
                
                // 2. Отправляем команду боту и закрываем приложение
                try {
                    tg.sendData(JSON.stringify({ action: "breathe" }));
                } catch (e) {
                    tg.showAlert("Ошибка отправки: " + e.message);
                }
            } else {
                alert("Ошибка: Telegram WebApp не инициализирован.");
            }
        }

        function closeApp() {
            if (tg) {
                tg.close();
            }
        }
    </script>
</body>
</html>
