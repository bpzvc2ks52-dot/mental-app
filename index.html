<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Остров</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #f8f9fc; --text: #1a1c29; --hint: #8b8d98;
            --primary: #4A55A2; --primary-light: #e8ebf7; --accent: #A084E8;
            --card: #ffffff; --border-radius: 16px;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg); color: var(--text); margin: 0; padding: 0;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        #welcome-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1c29; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 30px; transition: opacity 0.4s ease;
        }
        #welcome-screen.hidden { opacity: 0; visibility: hidden; }
        .welcome-title { font-size: 32px; font-weight: 800; color: #fff; margin-bottom: 10px; }
        .welcome-subtitle { font-size: 16px; color: #8b8d98; margin-bottom: 40px; text-align: center; }
        .welcome-btn {
            background-color: var(--accent); color: white; border: none;
            padding: 18px 30px; border-radius: 100px; font-size: 16px; font-weight: 700;
            cursor: pointer; width: 90%; max-width: 300px;
        }
        .top-nav {
            display: flex; background-color: var(--card); padding: 15px;
            border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03); overflow-x: auto; gap: 10px;
        }
        .nav-tab {
            font-size: 14px; font-weight: 600; color: var(--hint);
            cursor: pointer; padding: 8px 14px; border-radius: 12px; background-color: var(--bg);
            white-space: nowrap;
        }
        .nav-tab.active { background-color: var(--primary); color: white; }
        .content { flex: 1; overflow-y: auto; padding: 20px; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        .card { background-color: var(--card); border-radius: var(--border-radius); padding: 20px; margin-bottom: 20px; }
        .title { font-size: 20px; font-weight: 700; margin-bottom: 15px; }
        .btn {
            background-color: var(--primary); color: white; border: none; 
            padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 600; 
            width: 100%; margin-bottom: 12px; cursor: pointer;
        }
        input, textarea {
            width: 100%; padding: 16px; border-radius: 12px; border: 1px solid #ddd;
            background-color: var(--bg); color: var(--text); font-size: 15px; margin-bottom: 16px; font-family: inherit;
        }
        .profile-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; background-color: var(--card); padding: 20px; border-radius: var(--border-radius); }
        .avatar { width: 60px; height: 60px; border-radius: 50%; background-color: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; }
        .profile-info h2 { margin: 0; font-size: 20px; }
        .profile-info p { margin: 4px 0 0 0; color: var(--hint); font-size: 14px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="welcome-screen">
        <div class="welcome-title" id="welcome-title">Привет</div>
        <div class="welcome-subtitle">Добро пожаловать в твое безопасное место.</div>
        <button class="welcome-btn" id="enter-btn">Пройти на остров безопасности</button>
    </div>

    <div class="top-nav">
        <div class="nav-tab active" data-tab="home">Главная</div>
        <div class="nav-tab" data-tab="stress">От стресса</div>
        <div class="nav-tab" data-tab="journal">Дневник</div>
        <div class="nav-tab" data-tab="profile">Профиль</div>
    </div>

    <div class="content">
        <div id="tab-home" class="tab-pane active">
            <div class="title" id="hero-greeting">Привет!</div>
            <p style="color: var(--hint);">Это твое личное пространство для восстановления.</p>
            <button class="btn" data-tab="stress" style="margin-top: 20px;">От стресса</button>
            <button class="btn" data-tab="journal">Дневник</button>
        </div>

        <div id="tab-stress" class="tab-pane">
            <div class="card">
                <div class="title">Квадратное дыхание</div>
                <div style="text-align: center; margin: 20px 0;">
                    <div id="breath-circle" style="width: 120px; height: 120px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; margin: 0 auto;">4</div>
                    <div id="breath-text" style="margin-top: 15px; font-weight: 600;">Готов?</div>
                </div>
                <button class="btn" id="breath-btn">Начать</button>
            </div>
        </div>

        <div id="tab-journal" class="tab-pane">
            <div class="card">
                <div class="title">Дневник</div>
                <textarea id="diary-input" rows="4" placeholder="Что тебя тревожит?"></textarea>
                <button class="btn" id="diary-btn">Сохранить</button>
                <div id="diary-status" style="text-align: center; margin-top: 10px; font-weight: 600;"></div>
            </div>
        </div>

        <div id="tab-profile" class="tab-pane">
            <div class="profile-header">
                <div class="avatar" id="avatar-initial">U</div>
                <div class="profile-info">
                    <h2 id="profile-name">Пользователь</h2>
                    <p id="profile-id">ID: ...</p>
                </div>
            </div>
            <div class="card">
                <div class="title">Действия</div>
                <button class="btn" id="share-btn">📤 Поделиться ботом</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const tg = window.Telegram?.WebApp;
            if (tg) tg.expand();
            
            const userId = tg?.initDataUnsafe?.user?.id || "unknown";
            const userName = tg?.initDataUnsafe?.user?.first_name || "друг";
            const API_URL = "https://mental-bot-v2-maxdikov.mia0.amvera.tech"; 

            // Приветствие
            const welcomeTitle = document.getElementById('welcome-title');
            if (welcomeTitle) welcomeTitle.innerText = `Привет, ${userName}!`;
            
            const heroGreeting = document.getElementById('hero-greeting');
            if (heroGreeting) heroGreeting.innerText = `Привет, ${userName}!`;

            document.getElementById('profile-name').innerText = userName;
            document.getElementById('profile-id').innerText = `ID: ${userId}`;
            document.getElementById('avatar-initial').innerText = userName.charAt(0).toUpperCase();

            // Кнопка входа
            document.getElementById('enter-btn').addEventListener('click', function() {
                document.getElementById('welcome-screen').classList.add('hidden');
                if (tg) tg.HapticFeedback.impactOccurred('light');
            });

            // Навигация
            document.querySelectorAll('.nav-tab, [data-tab]').forEach(function(el) {
                el.addEventListener('click', function() {
                    const tabName = this.getAttribute('data-tab');
                    if (!tabName) return;
                    
                    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
                    document.querySelectorAll('.nav-tab').forEach(n => n.classList.remove('active'));
                    
                    const targetTab = document.getElementById(`tab-${tabName}`);
                    if (targetTab) targetTab.classList.add('active');
                    
                    const navTab = document.querySelector(`.nav-tab[data-tab="${tabName}"]`);
                    if (navTab) navTab.classList.add('active');
                });
            });

            // Дыхание (Упрощенное)
            let isBreathing = false;
            document.getElementById('breath-btn').addEventListener('click', async function() {
                if (isBreathing) return;
                isBreathing = true;
                const btn = this;
                const text = document.getElementById('breath-text');
                const circle = document.getElementById('breath-circle');
                btn.style.display = 'none';
                
                const sleep = ms => new Promise(r => setTimeout(r, ms));
                const phases = ["Вдох", "Задержка", "Выдох", "Задержка"];

                for (let i = 0; i < 4; i++) {
                    for (let p = 0; p < phases.length; p++) {
                        text.innerText = phases[p];
                        for (let s = 4; s > 0; s--) {
                            circle.innerText = s;
                            await sleep(1000);
                        }
                    }
                }
                
                text.innerText = "Молодец!";
                circle.innerText = "✅";
                btn.style.display = 'block';
                btn.innerText = "Начать заново";
                isBreathing = false;
            });

            // Дневник (Сохранение без ИИ, чтобы не было ошибок)
            document.getElementById('diary-btn').addEventListener('click', async function() {
                const text = document.getElementById('diary-input').value;
                if (!text) return;
                
                const statusEl = document.getElementById('diary-status');
                statusEl.innerText = "Сохранение...";
                
                try {
                    await fetch(`${API_URL}/api/diary`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_id: userId, text: text })
                    });
                    statusEl.innerText = "✅ Сохранено!";
                    document.getElementById('diary-input').value = "";
                } catch (e) {
                    statusEl.innerText = "⚠️ Ошибка сети";
                }
            });

            // Поделиться
            document.getElementById('share-btn').addEventListener('click', function() {
                const shareUrl = `https://t.me/share/url?url=https://t.me/Islandgoodness_bot&text=Попробуй этого бота!`;
                if (tg) tg.openTelegramLink(shareUrl);
            });
        });
    </script>
</body>
</html>
