<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Остров безопасности</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #f2f2f7; --card: #ffffff; --text: #000000; --text-sec: #8e8e93;
            --accent: #007aff; --accent-light: #e5f1ff; --border: #e5e5ea;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg); color: var(--text); margin: 0; padding: 0;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        .header { padding: 20px 20px 10px; font-size: 34px; font-weight: 700; letter-spacing: -0.5px; }
        .content { flex: 1; overflow-y: auto; padding: 0 20px 90px; }
        .tab-pane { display: none; animation: fadeIn 0.3s ease; }
        .tab-pane.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .card { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .card-title { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
        .card-desc { font-size: 14px; color: var(--text-sec); }

        .btn { background: var(--accent); color: white; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 600; width: 100%; cursor: pointer; margin-top: 12px; transition: opacity 0.2s; }
        .btn:active { opacity: 0.7; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-sec); font-size: 10px; font-weight: 500; cursor: pointer; width: 25%; }
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 22px; margin-bottom: 4px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 1000; display: none; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--card); width: 90%; max-width: 320px; border-radius: 20px; padding: 24px; text-align: center; }
        .mood-buttons { display: flex; justify-content: space-around; margin-top: 16px; }
        .mood-btn { font-size: 36px; background: none; border: none; cursor: pointer; }
        
        input, textarea { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); font-size: 16px; margin-bottom: 12px; font-family: inherit; }
        .ai-tip { background: var(--accent-light); padding: 12px; border-radius: 10px; margin-top: 12px; font-size: 14px; }
        .breath-circle { width: 150px; height: 150px; border-radius: 50%; background: var(--accent-light); border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 300; color: var(--accent); margin: 20px auto; transition: transform 4s ease-in-out; }
    </style>
</head>
<body>
    <div class="header" id="header-title">Главная</div>
    <div class="content">
        <div id="tab-home" class="tab-pane active">
            <div class="card" style="text-align: center; padding: 30px;">
                <div class="card-title" style="font-size: 24px;">Твоя серия</div>
                <div style="font-size: 64px; font-weight: 800; color: var(--accent); margin: 10px 0;" id="habit-streak">0</div>
                <div class="card-desc" id="habit-text">Нажми, чтобы отметить</div>
            </div>
            <div class="card"><div class="card-title">Добро пожаловать</div><div class="card-desc">Здесь ты можешь снять стресс, разобрать мысли и побыть с собой.</div></div>
        </div>
        <div id="tab-stress" class="tab-pane">
            <div class="card" style="text-align: center;">
                <div class="card-title">Квадратное дыхание</div>
                <div class="breath-circle" id="breath-circle">4</div>
                <div id="breath-text" style="font-weight: 600; margin-bottom: 10px;">Готов?</div>
                <button class="btn" id="breath-btn">Начать</button>
            </div>
        </div>
        <div id="tab-journal" class="tab-pane">
            <div class="card">
                <div class="card-title">Дневник</div>
                <textarea id="diary-input" rows="4" placeholder="Твои мысли..."></textarea>
                <button class="btn" id="diary-btn">Сохранить</button>
            </div>
            <div class="card">
                <div class="card-title">Заземление</div>
                <div id="ground-prompt" style="font-weight: 600; color: var(--accent); margin-bottom: 10px;">Назови 5 вещей, которые видишь</div>
                <input type="text" id="ground-input" placeholder="Напиши...">
                <button class="btn" id="ground-btn">Далее</button>
                <div id="ground-ai" class="ai-tip" style="display: none;"><span id="ground-ai-text"></span></div>
            </div>
        </div>
        <div id="tab-profile" class="tab-pane"><div class="card">Профиль</div></div>
    </div>
    <div class="bottom-nav">
        <div class="nav-item active" data-tab="home"><div class="nav-icon">◉</div>Главная</div>
        <div class="nav-item" data-tab="stress"><div class="nav-icon">◌</div>Дыхание</div>
        <div class="nav-item" data-tab="journal"><div class="nav-icon">≡</div>Дневник</div>
        <div class="nav-item" data-tab="profile"><div class="nav-icon">○</div>Профиль</div>
    </div>
    <div class="modal-overlay" id="mood-modal">
        <div class="modal">
            <div class="card-title">Как ты себя чувствуешь?</div>
            <div class="mood-buttons">
                <button class="mood-btn" data-score="5">😄</button><button class="mood-btn" data-score="4">🙂</button><button class="mood-btn" data-score="3">😐</button><button class="mood-btn" data-score="2">😕</button><button class="mood-btn" data-score="1">😭</button>
            </div>
        </div>
    </div>
    <script>
        // (Тут будет логика JS, аналогичная прошлым версиям, но я сократил для примера)
        // В реальном файле просто вставь скрипт из прошлого сообщения
    </script>
</body>
</html>
